[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "blueprint-ai"
version = "0.2.0"
description = "Deterministic-first software project analysis and remediation"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "pathspec>=1.1.1,<2",
  "pydantic>=2.13.5,<3",
  "PyYAML>=6.0.3,<7",
  "typer>=0.27.2,<1",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1,<10", "pytest-cov>=7.1.0,<8", "ruff>=0.16.6,<1"]
model = ["openai>=3.9.0,<4"]

[project.scripts]
blueprint-ai = "blueprint_ai.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/blueprint_ai"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
