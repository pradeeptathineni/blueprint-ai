name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  quality:
    name: Quality and package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --extra model --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run pip-audit
      - run: uv build --out-dir ci-dist
      - name: Verify release tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: test "$GITHUB_REF_NAME" = "$(uv run python -c 'import blueprint_ai; print(blueprint_ai.__version__)')"
      - name: Verify stable CLI, schema, report, configuration, and Python contracts
        run: uv run python benchmarks/compatibility_snapshot.py
      - name: Verify every published schema parses
        run: |
          for schema in settings report custom-blueprint intent genesis-plan project-graph \
            sandbox-policy evolution-plan evolution-report transformation authoritative-tool \
            migration-postcondition residual-contract; do
            uv run blueprint-ai schema "$schema" > "blueprint-ai-$schema.schema.json"
            uv run python -m json.tool "blueprint-ai-$schema.schema.json" > /dev/null
          done
      - run: uv run blueprint-ai doctor --json > blueprint-ai-doctor.json
      - run: uv run blueprint-ai review . --profile production --no-model --fail-on P1 --format sarif > blueprint-ai.sarif
      - run: uv run blueprint-ai review . --profile production --no-model --format junit > blueprint-ai.junit.xml
      - run: uv run blueprint-ai support --markdown > blueprint-support.md && cmp docs/support.md blueprint-support.md
      - name: Deterministic evolution corpus
        run: >-
          uv run python benchmarks/phase7_migrations.py
          --output phase7-migrations.json
          --only python/ruff-pyupgrade
          --only container/maintainer-to-oci-label
          --only github-actions/pin-official-actions
          --require python/ruff-pyupgrade

  workflow-audit:
    name: Workflow syntax and security audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Run pinned Actionlint
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          "$(go env GOPATH)/bin/actionlint"
      - name: Run pinned Zizmor without network analysis
        run: uvx --from zizmor==1.30.1 zizmor --pedantic --offline .github/workflows

  compatibility:
    name: Python ${{ matrix.python }} compatibility
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra dev --locked
      - run: uv run pytest -W error::DeprecationWarning --cov=blueprint_ai --cov-report=term-missing

  sandbox:
    name: Live OCI sandbox boundary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --locked
      - run: docker pull python:3.12-slim-bookworm
      - run: docker pull node:24-bookworm-slim
      - run: uv run pytest tests/test_phase6.py tests/test_redteam_sandbox.py -W error::DeprecationWarning
        env:
          BLUEPRINT_SANDBOX_TEST_IMAGE: python:3.12-slim-bookworm
          BLUEPRINT_SANDBOX_NODE_IMAGE: node:24-bookworm-slim

  windows:
    name: Windows CLI and wheel smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --extra dev --locked
      - run: uv run pytest tests/test_cli.py tests/test_config.py tests/test_model.py -W error::DeprecationWarning
      - run: uv build --out-dir windows-dist
      - name: Smoke test the installed Windows wheel
        shell: pwsh
        run: |
          uv venv windows-smoke
          $wheel = (Get-ChildItem windows-dist/*.whl).FullName
          uv pip install --python windows-smoke/Scripts/python.exe $wheel
          & "windows-smoke/Scripts/python.exe" benchmarks/release_smoke.py --output windows-smoke.json
